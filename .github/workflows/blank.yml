
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Arrange project
        shell: bash
        run: |
          set -e

          B=app/src/main

          mkdir -p "$B/java/com/tonix/wifireader"
          mkdir -p "$B/res/values"
          mkdir -p "$B/res/drawable"
          mkdir -p "$B/res/mipmap-anydpi-v26"

          [ ! -f AndroidManifest.xml ] || mv -f AndroidManifest.xml "$B/"
          [ ! -f MainActivity.kt ] || mv -f MainActivity.kt "$B/java/com/tonix/wifireader/"
          [ ! -f RadarView.kt ] || mv -f RadarView.kt "$B/java/com/tonix/wifireader/"
          [ ! -f MapScreen.kt ] || mv -f MapScreen.kt "$B/java/com/tonix/wifireader/"
          [ ! -f SignalMath.kt ] || mv -f SignalMath.kt "$B/java/com/tonix/wifireader/"
          [ ! -f TrackerScreen.kt ] || mv -f TrackerScreen.kt "$B/java/com/tonix/wifireader/"
          [ ! -f ARScreen.kt ] || mv -f ARScreen.kt "$B/java/com/tonix/wifireader/"
          [ ! -f colors.xml ] || mv -f colors.xml "$B/res/values/"
          [ ! -f ic_fg.xml ] || mv -f ic_fg.xml "$B/res/drawable/"
          [ ! -f ic_launcher.xml ] || mv -f ic_launcher.xml "$B/res/mipmap-anydpi-v26/"

          if [ -f strings.xml ]; then
            mv -f strings.xml "$B/res/values/"
          else
            echo '<resources><string name="app_name">WiFi Reader</string></resources>' > "$B/res/values/strings.xml"
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WiFiReader"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          mkdir -p app

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.tonix.wifireader'
              compileSdk 34

              defaultConfig {
                  applicationId "com.tonix.wifireader"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'org.osmdroid:osmdroid-android:6.1.17'
          }
          EOF

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Build debug APK
        run: gradle assembleDebug --console=plain

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WiFiReader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          

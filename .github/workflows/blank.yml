
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Arrange project
        shell: bash
        run: |
          set -euo pipefail

          B=app/src/main
          mkdir -p "$B/java/com/tonix/wifireader"
          mkdir -p "$B/res/values"
          mkdir -p "$B/res/drawable"
          mkdir -p "$B/res/mipmap-anydpi-v26"

          for f in MainActivity.kt RadarView.kt ARScreen.kt TrackerScreen.kt MapScreen.kt SignalMath.kt; do
            if [ -f "$f" ]; then
              mv -f "$f" "$B/java/com/tonix/wifireader/"
            fi
          done

          if [ -f AndroidManifest.xml ]; then
            mv -f AndroidManifest.xml "$B/"
          fi

          if [ -f colors.xml ]; then
            mv -f colors.xml "$B/res/values/"
          fi

          if [ -f ic_fg.xml ]; then
            mv -f ic_fg.xml "$B/res/drawable/"
          fi

          if [ -f ic_launcher.xml ]; then
            mv -f ic_launcher.xml "$B/res/mipmap-anydpi-v26/"
          fi

          if [ ! -f "$B/res/values/strings.xml" ]; then
            echo '<resources><string name="app_name">WiFi Reader</string></resources>' > "$B/res/values/strings.xml"
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WiFiReader"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          mkdir -p app

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.tonix.wifireader'
              compileSdk 34

              defaultConfig {
                  applicationId "com.tonix.wifireader"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'org.osmdroid:osmdroid-android:6.1.17'
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --console=plain

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WiFiReader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
